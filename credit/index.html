<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR++</title>
    <!-- 파비콘 원본: export/1004/burst_124.png. 배경 투명(iOS는 apple-touch-icon의 투명부를 검정으로 채움) -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <!-- 첫 화면 사진을 미리 예약한다 — 사진 배치는 이름 JSON을 받은 뒤에야 시작하므로
         그냥 두면 요청이 그만큼 늦게 출발한다. script.js의 EAGER_COUNT와 장수를 맞출 것. -->
    <link rel="preload" as="image" href="images/onsite/01.jpg" />
    <link rel="preload" as="image" href="images/onsite/02.jpg" />
    <link rel="preload" as="image" href="images/onsite/03.jpg" />

    <link rel="stylesheet" href="style.css" />
    <!-- 우측 하단 메뉴 — style.css 뒤에 와야 버튼 규칙이 덮이지 않는다 -->
    <link rel="stylesheet" href="../shared/menu.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <div id="credit-wrap">
      <div id="marquee">
        <div class="marquee-track">
          <div class="marquee-group">
            <span>이 프로젝트에 참여해주신 총 <b class="count">203</b>분의 기여를 기리며...</span>
            <span>이 프로젝트에 참여해주신 총 <b class="count">203</b>분의 기여를 기리며...</span>
            <span>이 프로젝트에 참여해주신 총 <b class="count">203</b>분의 기여를 기리며...</span>
          </div>
          <div class="marquee-group" aria-hidden="true">
            <span>이 프로젝트에 참여해주신 총 <b class="count">203</b>분의 기여를 기리며...</span>
            <span>이 프로젝트에 참여해주신 총 <b class="count">203</b>분의 기여를 기리며...</span>
            <span>이 프로젝트에 참여해주신 총 <b class="count">203</b>분의 기여를 기리며...</span>
          </div>
        </div>
      </div>

      <!-- #photo-layer(사진)가 뒤, #credit-names(이름)가 그 위. 둘 다 JS가 채운다. -->
      <main id="credit">
        <div id="credit-stage">
          <div id="photo-layer" aria-hidden="true"></div>
          <div id="credit-names"></div>
        </div>
      </main>
    </div>
    <!-- ── 메뉴 (우측 하단) — 디자인은 shared/menu.css, 동작은 shared/menu.js ──── -->
    <button id="menu-btn" aria-label="메뉴" aria-expanded="false">
      <span></span><span></span><span></span><span></span>
    </button>
    <div id="menu-overlay" aria-hidden="true">
      <!-- 항목 사이 간격은 shared/menu.css의 #menu-list gap 하나로 조절한다. -->
      <div id="menu-list">
        <a class="menu-item" data-key="about" href="../index.html">About</a>
        <a class="menu-item" data-key="archive" href="../archive/index.html">Archive</a>
        <a class="menu-item" data-key="credit" href="../credit/index.html" aria-current="page">Credit</a>
        <!-- Apply — 외부 구글 폼. rel="noopener"는 새 탭이 window.opener로 이 페이지를 건드리지 못하게 막는다. -->
        <a class="menu-item" data-key="apply"
           href="https://docs.google.com/forms/d/e/1FAIpQLSeOAERlk3hNw2IOnEcZyU76RGW8_SGniRNc4jonOmi9ew3ZWg/viewform?usp=header"
           target="_blank"
           rel="noopener noreferrer">Apply</a>
      </div>
    </div>
    <script src="../shared/menu.js"></script>
    <script src="script.js"></script>
  </body>
</html>
