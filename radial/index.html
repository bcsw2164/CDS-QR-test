<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR++</title>
    <!-- 파비콘 — 아카이브 그래픽 qr_124(정현)를 내용 영역만 잘라 쓴다.
         원본은 export/1004/burst_124.png.
         배경은 투명 — 탭 바가 밝든 어둡든 그래픽만 떠 보인다. 다만 iOS는
         apple-touch-icon의 투명부를 검정으로 채운다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="canvas-wrap"></div>
      <div id="controls">
        <div class="slider-row">
          <label>errorA <span class="desc">— 다발 선 개수(u)</span></label>
          <input
            type="range"
            id="sliderA"
            min="0"
            max="1"
            value="0.3"
            step="0.001"
          />
          <span class="val" id="valA">0.3</span>
        </div>
        <div class="slider-row">
          <label>errorB <span class="desc">— 부채꼴 열림각(o)</span></label>
          <input
            type="range"
            id="sliderB"
            min="0"
            max="1"
            value="0.3"
            step="0.001"
          />
          <span class="val" id="valB">0.3</span>
        </div>
        <div id="btn-row">
          <button id="btnRegen">랜덤 생성</button>
          <button id="btnSave">PNG 저장 (S)</button>
        </div>
      </div>
    </div>
    <script src="../shared/core.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
