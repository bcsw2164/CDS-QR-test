<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- 사파리 툴바 틴트 색. 페이지 배경(검정)과 맞춰야 툴바가 연장선처럼 보인다. -->
    <meta name="theme-color" content="#000000" />
    <title>QR++</title>
    <!-- 파비콘 원본: export/1004/burst_124.png. 배경 투명(iOS는 apple-touch-icon의 투명부를 검정으로 채움) -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <!-- 우측 하단 메뉴 — style.css 뒤에 와야 버튼 규칙이 덮이지 않는다 -->
    <link rel="stylesheet" href="../shared/menu.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <!-- Wanted Sans — 이름 표기 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/static/complete/WantedSans.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
    <div id="archive-wrap">
      <!-- 버튼 두 줄을 한 상자로 묶어 position:sticky로 화면 위에 고정한다. -->
      <div id="control-bars">
        <div id="shape-row" class="shape-row">
          <button class="shape-btn active" data-shape="radial-spokes">burst</button>
          <button class="shape-btn" data-shape="radial">bloom</button>
          <!-- 보류한 안(ring·tile)은 archive/experiments.js 에 보관. 복구 절차는 그 파일 헤더 참고. -->
        </div>
        <div id="mode-row" class="mode-row">
          <button class="mode-btn active" data-mode="collected">수집순</button>
          <button class="mode-btn" data-mode="error">오차율순</button>
        </div>
      </div>
      <div id="canvas-holder"></div>
    </div>
    <!-- ── 메뉴 (우측 하단) — 디자인은 shared/menu.css, 동작은 shared/menu.js ──── -->
    <button id="menu-btn" aria-label="메뉴" aria-expanded="false">
      <span></span><span></span><span></span><span></span>
    </button>
    <div id="menu-overlay" aria-hidden="true">
      <!-- 항목 사이 간격은 shared/menu.css의 #menu-list gap 하나로 조절한다. -->
      <div id="menu-list">
        <a class="menu-item" data-key="about" href="../index.html">About</a>
        <a class="menu-item" data-key="archive" href="../archive/index.html" aria-current="page">Archive</a>
        <a class="menu-item" data-key="credit" href="../credit/index.html">Credit</a>
        <!-- Apply — 외부 구글 폼. rel="noopener"는 새 탭이 window.opener로 이 페이지를 건드리지 못하게 막는다. -->
        <a class="menu-item" data-key="apply"
           href="https://docs.google.com/forms/d/e/1FAIpQLSeOAERlk3hNw2IOnEcZyU76RGW8_SGniRNc4jonOmi9ew3ZWg/viewform?usp=header"
           target="_blank"
           rel="noopener noreferrer">Apply</a>
      </div>
    </div>
    <div id="detail-overlay">
      <!-- 박스와 저장 버튼을 세로로 묶는다 — 버튼은 박스 '밖', 바로 아래에 놓인다. -->
      <div class="detail-stack">
        <div class="detail-box">
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>
          <button id="detail-prev" class="detail-nav" aria-label="이전">&lsaquo;</button>
          <button id="detail-next" class="detail-nav" aria-label="다음">&rsaquo;</button>
          <div id="detail-media" data-stage="graphic">
            <div id="detail-flipper">
              <div id="detail-graphic"></div>
              <img id="detail-qr" src="" alt="QR 이미지" />
            </div>
          </div>
          <p id="detail-name"></p>
        </div>
        <!-- 이 항목을 한 장의 이미지로 저장. 합성은 shared/save-card.js. -->
        <button id="detail-save" type="button">저장하기</button>
      </div>
    </div>
    <script src="../shared/menu.js"></script>
    <script src="../shared/core.js"></script>
    <script src="../shared/save-card.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
