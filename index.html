<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR++</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      /* ── 리셋 ───────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── 기본 ───────────────────────────────────────────── */
      :root {
        --c-bg:     #fff;
        --c-fg:     #111;
        /* 선 굵기도 화면에 따라 조금씩 — 아카이브의 4px이 기준값 */
        --border-w: clamp(4px, 1vw, 6px);
        --nav-h:    clamp(56px, 10vw, 76px);
        --pad-x:    clamp(20px, 5.3vw, 44px);
      }

      html { font-size: 16px; }

      body {
        background: var(--c-bg);
        color: var(--c-fg);
        font-family: 'Pretendard', sans-serif;
        overflow-x: hidden; /* 그래픽이 좌우로 넘칠 때 수평 스크롤 방지 */
      }

      /* ── 네비게이션 ────────────────────────────────────── */
      #nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 200;
        height: var(--nav-h);
        background: var(--c-bg);
        border-bottom: var(--border-w) solid var(--c-fg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--pad-x);
      }

      #nav-logo {
        font-size: clamp(22px, 5.9vw, 42px);
        font-weight: 900;
        letter-spacing: -0.02em;
        color: var(--c-fg);
        text-decoration: none;
        user-select: none;
      }

      /* 2×2 그리드 아이콘 버튼 */
      #menu-btn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: clamp(5px, 1.3vw, 8px);
        width: clamp(28px, 7.4vw, 44px);
        height: clamp(28px, 7.4vw, 44px);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
      }

      /* 칸을 꽉 채우게 두면 버튼 크기만 바꿔도 네 사각형이 같이 따라온다 */
      #menu-btn span {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--c-fg);
      }

      /* ── 메뉴 오버레이 ─────────────────────────────────── */
      #menu-overlay {
        position: fixed;
        inset: 0;
        top: var(--nav-h);
        background: var(--c-bg);
        border-top: var(--border-w) solid var(--c-fg);
        z-index: 190;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
        transition: opacity 0.2s, transform 0.2s;
      }

      body.menu-open #menu-overlay {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .menu-item {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--pad-x);
        border-bottom: var(--border-w) solid var(--c-fg);
        font-size: clamp(28px, 7vw, 42px);
        font-weight: 900;
        color: var(--c-fg);
        text-decoration: none;
        letter-spacing: -0.02em;
        transition: background 0.15s;
      }

      .menu-item:last-child { border-bottom: none; }

      .menu-item::after {
        content: '→';
        font-size: 0.7em;
        font-weight: 700; /* 400은 옆 900 레이블에 비해 힘이 빠져 보인다 */
        opacity: 0.5;
      }

      .menu-item:hover,
      .menu-item:active {
        background: var(--c-fg);
        color: var(--c-bg);
      }

      /* ── 메인 ───────────────────────────────────────────── */
      #main {
        padding-top: var(--nav-h);
      }

      #section-main {
        position: relative;
        /* 그래픽이 좌우·상하로 넘치는 부분을 여기서 자른다. 섹션이 화면
           전체 너비이므로 좌우 클리핑 = 화면 끝에서 잘리는 효과가 되고,
           세로로도 잘라줘야 absolute 그래픽 때문에 페이지가 늘어나지 않는다. */
        overflow: hidden;
      }

      /* 그래픽의 위치 기준점. 그래픽은 이 상자의 위쪽 모서리(= 네비 바로
         아래)에서 dvh 단위로 내려간 자리에 붙으므로, 이 상자의 '높이'는
         배치에 영향을 주지 않는다. 문단을 더하거나 빼도 그래픽은 안 밀린다. */
      #text-area {
        position: relative;
      }

      /* 스크롤 회전을 충분히 볼 수 있도록 텍스트 아래에 남기는 빈 여백 */
      #scroll-spacer {
        height: 110dvh;
      }

      .text-block {
        /* 글의 중심을 '네비 아래 영역'이 아니라 '화면' 정중앙(50dvh)에
           맞춘다.

           #main이 padding-top: var(--nav-h)라 이 블록은 네비 바로 아래
           (= nav-h 지점)에서 시작한다. 높이를 H라 하면 가운데 정렬된 글의
           중심은 nav-h + H/2 이므로, 이게 50dvh가 되려면
             nav-h + H/2 = 50dvh  →  H = 100dvh - 2×nav-h
           네비 높이를 두 번 빼는 건 그래서다. 한 번만 빼면 네비 아래
           영역의 중앙이 되어 글이 nav-h/2 만큼 내려가 앉는다.

           dvh라 모바일 주소창이 접히고 펴지는 것도 따라간다. */
        min-height: calc(100dvh - 2 * var(--nav-h));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 var(--pad-x);
        position: relative;
        z-index: 1; /* 그래픽보다 위에 */
      }

      /* 두 문단을 하나로 묶는 상자. 둘 다 흐름 안에 있어 이 상자의 높이가
         '문단1 + 간격 + 문단2' 전체가 되고, .text-block의 align-items:center가
         그 덩어리를 통째로 가운데 놓는다 → 두 문단의 무게중심이 화면
         정중앙에 온다. 기기 높이·네비 높이·문단 줄 수가 달라져도 자동. */
      .text-anchor {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 문단 사이 간격. .text-anchor에 gap으로 주지 않고 여기에 margin으로
         두는 이유는, em이 '그 요소의 글자 크기' 기준이기 때문이다.
         .text-anchor는 본문 글자 크기를 갖고 있지 않아 gap: 6em이 16px
         기준(96px 고정)으로 잡히지만, 문단 자신에게 걸면 clamp로 커지는
         본문 크기를 따라가 어느 기기에서나 같은 비율이 유지된다. */
      .text-sub {
        margin-top: 6em; /* ← 문단 사이 간격 */
      }

      .main-text {
        text-align: center;
        /* 화면 너비에 비례해 계속 커진다. 양끝(13px/30px)은 너무 작아지거나
           커지는 것만 막는 안전장치. */
        font-size: clamp(13px, 3.8vw, 30px);
        /* 아카이브가 Pretendard 800~900의 묵직한 톤이라, 본문도 700으로
           올려 같은 무게감을 준다(500은 옆 그래픽·네비에 비해 얇아 보임). */
        font-weight: 700;
        letter-spacing: -0.01em; /* 굵어진 만큼 자간을 살짝 좁혀 뭉침 방지 */
        line-height: 1.9; /* 단위 없는 배수라 글자 크기를 따라간다 */
        /* 두 상한 중 작은 쪽을 단 폭으로 쓴다.
             82vw — 화면 너비의 82%. 좌우에 최소 9%씩 여백을 남겨, 어떤
                    화면에서도 텍스트가 가장자리(그래픽 영역)까지 밀고
                    나가지 않게 막는 한계선.
             34em — 글자 크기 기준 상한. 첫 절이 약 33em이라 이 폭이면
                    가로로 긴 화면에서 한 줄에 들어간다.

           좁은 화면에서는 82vw가, 넓은 화면(대략 1250px 이상)에서는 34em이
           작아서 이긴다. 그래서 세로 화면은 지금처럼 21em 남짓으로 접히고,
           가로 화면은 단이 넓어지며 절이 한 줄로 펴진다. em 단독으로 두면
           글자 크기가 상한(30px)에 걸린 뒤 단 폭이 고정돼 가로 화면에서만
           덩그러니 좁아 보인다. */
        max-width: min(84vw, 34em);
        word-break: keep-all;
        color: var(--c-fg);
      }

      /* 절 하나 = 한 덩어리. block이라 절과 절 사이는 반드시 줄이 나뉘고,
         절이 단 폭보다 길면 그 안에서만 자동으로 접힌다. */
      .main-text .clause {
        display: block;
      }

      /* ── 스포크 그래픽 래퍼 ────────────────────────────── */
      .spoke-wrap {
        position: absolute;
        pointer-events: none;
        will-change: transform; /* GPU 레이어로 올려 rotation 성능 확보 */
      }

      /* 반응형 분기(@media)는 두지 않는다 — 위의 모든 치수가 clamp()로
         화면 너비를 따라 연속적으로 변하므로, 특정 폭에서 값이 툭 튀는
         구간 없이 어느 기기에서나 같은 비율로 보인다. */
    </style>
  </head>
  <body>

    <!-- ── 네비게이션 ───────────────────────────────────── -->
    <nav id="nav">
      <a id="nav-logo" href="index.html">QR++</a>
      <button id="menu-btn" aria-label="메뉴" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>
    </nav>

    <!-- ── 메뉴 오버레이 ────────────────────────────────── -->
    <div id="menu-overlay" aria-hidden="true">
      <a class="menu-item" href="archive/index.html">Archive</a>
      <a class="menu-item" href="behind/index.html">Behind</a>
    </div>

    <!-- ── 메인 ─────────────────────────────────────────── -->
    <main id="main">
      <section id="section-main">

        <div id="text-area">
          <!-- 스포크 그래픽 캔버스는 JS가 여기에 추가 -->

          <!-- 문장을 의미 단위(절)로 끊어 <span class="clause">로 감싼다.
               각 절은 자기 안에서만 자동 줄바꿈되고 절과 절 사이는 항상
               줄이 나뉘므로, "데이터화하고, / 이를" 처럼 뜻이 넘어가는
               자리에서 끊긴다. <br>과 달리 절 안쪽 줄바꿈은 화면 너비에
               맡겨둘 수 있다. -->
          <div class="text-block">
            <!-- 두 문단을 .text-anchor로 묶어 한 덩어리로 다룬다.
                 이 덩어리 전체가 화면 정중앙에 놓인다. -->
            <div class="text-anchor">
              <p class="main-text">
                <span class="clause">동일한 QR 패턴을 여러 사람이 복제하며 생긴 오차와 흔적을 데이터화하고,</span>
                <span class="clause">이를 새로운 그래픽으로 재구성합니다.</span>
              </p>

              <p class="main-text text-sub">
                <span class="clause">QR은 정보 전달을 위한 기계의 언어를 넘어</span>
                <span class="clause">새로운 시각 언어이자 생성 예술의 매체로 확장됩니다.</span>
              </p>
            </div>
          </div>
        </div>

        <!-- 스크롤 회전을 보기 위한 빈 여백 -->
        <div id="scroll-spacer"></div>

      </section>
    </main>

    <!-- ── p5.js + core.js ──────────────────────────────── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="shared/core.js"></script>

    <script>
      /* ── 메뉴 토글 ──────────────────────────────────── */
      const menuBtn     = document.getElementById('menu-btn');
      const menuOverlay = document.getElementById('menu-overlay');

      menuBtn.addEventListener('click', () => {
        const open = document.body.classList.toggle('menu-open');
        menuBtn.setAttribute('aria-expanded', open);
        menuOverlay.setAttribute('aria-hidden', !open);
      });

      menuOverlay.querySelectorAll('.menu-item').forEach(el => {
        el.addEventListener('click', () => {
          document.body.classList.remove('menu-open');
          menuBtn.setAttribute('aria-expanded', 'false');
          menuOverlay.setAttribute('aria-hidden', 'true');
        });
      });

      /* ── 스포크 그래픽 설정 ──────────────────────────
         시안(모바일 349px 기준)에서 각 그래픽의 지름·중심 좌표를 재서
         화면 너비 대비 비율(vw배수)과 텍스트 영역 대비 세로 위치(%)로
         옮긴 값이다. 그래서 기기 너비가 달라져도 시안의 배치 비율이
         그대로 유지된다.

         size   : [minPx, 배수, maxPx] — viewportUnit()에 비례하되 양끝을 잠금
         top    : 네비 아래를 0으로 잡은 캔버스 위쪽 모서리 위치(dvh).
                  100이면 딱 한 화면 아래. 텍스트는 첫 화면(0~100dvh)
                  안에 모여 있고 — 1문단 중앙 약 47, 2문단 약 62 —
                  그 아래 100~200dvh는 스크롤하며 그래픽만 지나간다.
         offset : size 대비 비율. 양수면 그 비율만큼 화면 밖으로 밀려나
                  중심이 가장자리 바깥에 놓이고, 음수면 안쪽으로 들어온다.

         [중요] size는 캔버스 크기이지 눈에 보이는 지름이 아니다. 실제로
         보이는 지름은 errorA가 정한다 — errorA가 클수록 살이 바깥까지
         뻗어 캔버스를 꽉 채우고, 작을수록 중심에 옹기종기 모인다.
           errorA 0.15 → 캔버스의 약 60%만 채움
           errorA 0.50 → 약 71%
           errorA 0.85 → 약 82%
         그래서 errorA가 낮은 그래픽은 size를 그만큼 더 키워야 다른 것과
         같은 크기로 보인다. 아래 size 값은 그 보정을 반영한 것이다.

         보이는 지름 기준 대·중·소 (viewportUnit 대비):
           특대 1.05 / 대 0.82 / 중대 0.62 / 중 0.45 / 소 0.30
      ─────────────────────────────────────────────────── */
      // [side, size, top(dvh), offset, errorA, errorB, colorSeed, rotDir, rotSpeed]
      const SPOKE_CFG = [
        // ── 첫 화면 (텍스트와 같은 화면) ──
        // 대 — 좌상단. 네비 바로 아래에서 시작해 문단 왼쪽에 걸친다
        ['left',  [370, 1.15,  920],   0,  0.48, 0.50, 0.30, 1001,  1, 0.055],
        // 특대 — 우측. 가장 큰 그래픽, 두 문단 오른쪽을 가로지른다
        ['right', [410, 1.28, 1020],  25,  0.60, 0.85, 0.25, 1004, -1, 0.045],
        // ── 아래 여백 구간 (스크롤하며 차례로 나타남) ──
        // 소 — 좌측, 화면 안쪽에 작게
        ['left',  [160, 0.50,  400],  78, -0.08, 0.15, 0.50, 1002,  1, 0.11 ],
        // 중 — 우측 (대·소 사이를 메우는 중간 크기)
        ['right', [205, 0.645, 515], 105,  0.45, 0.45, 0.55, 1006, -1, 0.075],
        // 중대 — 좌하단
        ['left',  [265, 0.83,  665], 140,  0.29, 0.60, 0.45, 1003,  1, 0.06 ],
      ];

      /* 그래픽 크기의 기준이 되는 단위.

         너비만 쓰면 가로로 납작한 화면(태블릿 가로·데스크톱)에서 어긋난다.
         크기는 너비를 따라 커지는데 세로 위치는 dvh를 따라가기 때문에,
         너비는 넓고 높이는 낮은 화면에서 그래픽만 부풀어 화면 높이를 다
         잡아먹는다. 높이에 1.2를 곱한 값과 견줘 작은 쪽을 쓰면,
           · 세로로 긴 화면(1.2h > w) — 지금까지처럼 너비를 따라간다
           · 납작한 화면(1.2h < w)   — 높이가 상한을 잡아준다
         1.2를 곱하는 건 세로 화면에서 높이가 끼어들지 않게 하려는 여유분.
         덕분에 모바일에서 주소창이 접혀 높이가 변해도 크기는 그대로다
         (= 스크롤 중에 그래픽이 다시 그려지지 않는다). */
      function viewportUnit() {
        return Math.min(window.innerWidth, window.innerHeight * 1.2);
      }

      // [minPx, 배수, maxPx] → 현재 화면 기준 실제 px
      function resolveSize([minPx, factor, maxPx]) {
        return Math.round(Math.max(minPx, Math.min(maxPx, viewportUnit() * factor)));
      }

      let spokeEls = [];

      /* 화면 너비에 맞춰 그래픽을 전부 다시 만든다(최초 1회 + 리사이즈).
         errorA/errorB/colorSeed가 고정이라 크기만 달라지고 모양·색은 동일. */
      function buildSpokes() {
        const area = document.getElementById('text-area');

        // 이전 버퍼 정리 — 안 하면 리사이즈마다 캔버스가 쌓인다.
        spokeEls.forEach(({ el, gfx }) => {
          gfx.remove();
          el.remove();
        });
        spokeEls = [];

        const density = Math.min(window.devicePixelRatio || 1, 2);

        SPOKE_CFG.forEach(([side, sizeSpec, topDvh, offRatio, eA, eB, seed, dir, speed]) => {
          const size = resolveSize(sizeSpec);
          const xOff = -Math.round(size * offRatio); // 화면 밖으로 나가는 양

          /* 래퍼 div — 위치 지정 */
          const wrap = document.createElement('div');
          wrap.className = 'spoke-wrap';
          wrap.style.width  = `${size}px`;
          wrap.style.height = `${size}px`;
          /* %가 아니라 dvh — %로 두면 부모(#text-area) 높이에 묶여서,
             문단 구성이나 블록 높이를 손댈 때마다 그래픽이 통째로
             밀린다. dvh는 화면 높이 기준이라 텍스트 구조와 무관하게
             "네비 아래에서 N화면만큼 내려간 자리"로 고정된다. */
          wrap.style.top    = `${topDvh}dvh`;
          wrap.style[side]  = `${xOff}px`; // left 또는 right

          /* p5.Graphics 생성 + 스포크 드로잉 */
          const g = createGraphics(size, size);
          g.pixelDensity(density);
          g.colorMode(HSB, 360, 100, 100);
          // 배경을 칠하지 않는다 — p5.Graphics는 기본이 투명이라 페이지
          // 흰 배경이 그대로 비친다. 여기서 background()로 흰색을 칠하면
          // 캔버스의 정사각형 영역이 불투명해져서, 겹쳐 놓인 다른 그래픽의
          // 살·점을 사각형 모서리로 잘라먹는다.

          drawRadialSpokeDots(
            g,
            size / 2, size / 2, // cx, cy
            size * 0.93,        // 캔버스 대비 여백 조금 두기
            eA, eB, seed
          );

          g.canvas.style.display = 'block';
          g.canvas.style.width   = '100%';
          g.canvas.style.height  = '100%';

          wrap.appendChild(g.canvas);
          area.appendChild(wrap);

          spokeEls.push({ el: wrap, gfx: g, dir, speed });
        });

        applyRotation(); // 리사이즈 직후에도 현재 스크롤 각도를 유지
      }

      /* 현재 스크롤 위치를 각 그래픽의 회전각으로 반영 */
      function applyRotation() {
        const sy = window.scrollY;
        spokeEls.forEach(({ el, dir, speed }) => {
          el.style.transform = `rotate(${sy * speed * dir}deg)`;
        });
      }

      /* ── p5 global setup ─────────────────────────────── */
      function setup() {
        noCanvas(); // 메인 캔버스 불필요
        colorMode(HSB, 360, 100, 100);

        buildSpokes();
        noLoop(); // 정적 그래픽 — 애니메이션 루프 불필요

        /* ── 스크롤 → 회전 애니메이션 ────────────────── */
        let ticking = false;
        window.addEventListener('scroll', () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            applyRotation();
            ticking = false;
          });
        }, { passive: true });
      }

      /* 화면 너비가 바뀌면 크기를 다시 계산해 새로 그린다.
         연속 리사이즈마다 전부 다시 그리면 비싸므로 살짝 묶어서 처리. */
      let resizeTimer = null;
      function windowResized() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(buildSpokes, 150);
      }
    </script>
  </body>
</html>
