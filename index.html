<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR++</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />

    <!-- Pretendard — 로고·메뉴·버튼 등 UI 요소 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />

    <!-- Wanted Sans — 본문 문단 -->
    <link
      rel="preload"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/static/complete/WantedSans.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/static/complete/WantedSans.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ── 네비게이션 ───────────────────────────────────── -->
    <nav id="nav">
      <a id="nav-logo" href="index.html">QR++</a>
      <button id="menu-btn" aria-label="메뉴" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>
    </nav>

    <!-- ── 메뉴 오버레이 ────────────────────────────────── -->
    <div id="menu-overlay" aria-hidden="true">
      <a class="menu-item" href="archive/index.html">Archive</a>
      <a class="menu-item" href="behind/index.html">Behind</a>
    </div>

    <!-- ── 메인 ─────────────────────────────────────────── -->
    <main id="main">
      <section id="section-main">

        <div id="text-area">
          <!-- 스포크 그래픽 캔버스는 sketch.js가 여기에 추가 -->

          <!-- 문장을 의미 단위(절)로 끊어 <span class="clause">로 감싼다.
               각 절은 자기 안에서만 자동 줄바꿈되고 절과 절 사이는 항상
               줄이 나뉘므로, "데이터화하고, / 이를" 처럼 뜻이 넘어가는
               자리에서 끊긴다. <br>과 달리 절 안쪽 줄바꿈은 화면 너비에
               맡겨둘 수 있다. -->
          <div class="text-block">
            <!-- 두 문단을 .text-anchor로 묶어 한 덩어리로 다룬다.
                 이 덩어리 전체가 화면 정중앙에 놓인다. -->
            <div class="text-anchor">
              <p class="main-text">
                <span class="clause">동일한 QR 패턴을 여러 사람이 복제하며 생긴 오차와 흔적을 데이터화하고,</span>
                <span class="clause">이를 새로운 그래픽으로 재구성합니다.</span>
              </p>

              <p class="main-text text-sub">
                <span class="clause">QR은 정보 전달을 위한 기계의 언어를 넘어</span>
                <span class="clause">새로운 시각 언어이자 생성 예술의 매체로 확장됩니다.</span>
              </p>
            </div>
          </div>

          <!-- QR 루프 영상 — 텍스트 블록 다음에 흐름으로 놓이므로
               텍스트 아래에서 시작한다. muted/playsinline이 없으면
               자동재생이 막히고, iOS에서는 전체화면으로 튀어나온다.
               재생 시작·정지는 sketch.js가 화면 진입 여부로 판단한다. -->
          <div id="qr-video-wrap">
            <video id="qr-video"
                   src="qr_import2.mp4"
                   muted loop playsinline
                   preload="none"
                   disablepictureinpicture></video>
          </div>
        </div>

      </section>
    </main>

    <!-- 아카이브로 넘어가는 버튼 — 화면 하단 가운데 고정.
         #section-main의 overflow:hidden에 잘리지 않도록 <main> 바깥에 둔다. -->
    <a id="archive-fab" href="archive/index.html">아카이브</a>

    <!-- ── 스크립트 ─────────────────────────────────────
         순서가 중요하다. sketch.js가 p5의 createGraphics·noCanvas와
         core.js의 drawRadialSpokeDots를 쓰므로 둘 다 먼저 와야 한다.
         또 sketch.js는 전역 setup()·windowResized()를 p5에 넘기는
         구조라 type="module"을 붙이면 안 된다(모듈 스코프에 갇혀
         p5가 찾지 못한다). 셋 다 문서 맨 끝에 두어, 스크립트가
         document.getElementById로 요소를 찾을 때 이미 DOM이 준비된
         상태가 되게 한다.

         [주의] 이 파일의 주석에는 body 닫는 태그를 글자 그대로 적지
         말 것. live-server가 그 문자열을 찾아 리로드 스크립트를
         끼워넣기 때문에, 주석 안에 있어도 거기서 문서가 잘려
         뒷부분이 화면에 텍스트로 튀어나온다. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="shared/core.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
