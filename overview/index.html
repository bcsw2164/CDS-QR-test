<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Series Overview</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="canvas-grid">
        <div class="preview-cell" data-shape="radial">
          <div class="cell-label">3 방사형</div>
        </div>
        <div class="preview-cell" data-shape="radial-spokes">
          <div class="cell-label">3 방사형 스포크</div>
        </div>
      </div>
      <div id="controls">
        <div class="slider-row">
          <label>errorA <span class="desc">— u</span></label>
          <input
            type="range"
            id="sliderA"
            min="0"
            max="1"
            value="0.3"
            step="0.001"
          />
          <span class="val" id="valA">0.3</span>
        </div>
        <div class="slider-row">
          <label>errorB <span class="desc">— o</span></label>
          <input
            type="range"
            id="sliderB"
            min="0"
            max="1"
            value="0.3"
            step="0.001"
          />
          <span class="val" id="valB">0.3</span>
        </div>
        <div id="btn-row">
          <button id="btnRegen">랜덤 생성</button>
          <button id="btnSave">PNG 저장 (S)</button>
        </div>
      </div>
    </div>
    <script src="../shared/core.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
